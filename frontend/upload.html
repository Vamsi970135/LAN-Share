<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload File - Secure LAN File Sharing</title>
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
            min-height: 100vh;
        }

        .upload-card {
            background: rgba(255,255,255,0.97);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            border-radius: 20px 20px 0 0;
            padding: 32px 32px 28px;
            text-align: center;
        }

        .card-body { padding: 28px 32px 32px; }



        /* IPFS status bar — lives inside the card */
        #ipfs-status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        #ipfs-status-bar.checking {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fcd34d;
        }
        #ipfs-status-bar.online {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
        }
        #ipfs-status-bar.offline {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
        .ipfs-dot {
            width: 10px; height: 10px;
            border-radius: 50%; flex-shrink: 0;
        }
        .checking .ipfs-dot { background: #f59e0b; }
        .online   .ipfs-dot { background: #10b981; box-shadow: 0 0 6px #10b981; }
        .offline  .ipfs-dot { background: #ef4444; }

        /* File drop zone */
        .file-drop {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 28px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            background: #f8fafc;
        }
        .file-drop:hover,
        .file-drop.drag-over {
            border-color: #4f46e5;
            background: #eef2ff;
        }

        /* Upload button */
        .upload-btn {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(79,70,229,0.4);
            transition: all 0.25s;
        }
        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79,70,229,0.6);
        }
        .upload-btn:active { transform: translateY(0); }

        /* Progress bar */
        #progress-container { margin-top: 16px; }
        .progress-track {
            background: #e2e8f0;
            border-radius: 99px;
            height: 10px;
            overflow: hidden;
        }
        #progress-bar {
            background: linear-gradient(90deg, #2563eb, #4f46e5);
            height: 100%;
            border-radius: 99px;
            width: 0%;
            transition: width 0.4s ease;
            animation: shimmer 1.5s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%,100% { opacity: 1; }
            50%      { opacity: 0.7; }
        }

        /* Messages */
        #successMessage {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.875rem;
            font-weight: 600;
        }
        #errorMessage {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        /* Back button */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #4f46e5;
            font-weight: 600;
            font-size: 0.9rem;
            background: none;
            border: none;
            cursor: pointer;
            transition: color 0.2s;
            text-decoration: none;
        }
        .back-btn:hover { color: #2563eb; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-lg w-full upload-card">

        <!-- Card header -->
        <div class="card-header">
            <h1 class="text-3xl font-bold mb-1" style="color:#ffffff;">Upload File</h1>
            <p class="text-sm" style="color:rgba(255,255,255,0.85);">Securely share files on your LAN network</p>
        </div>

        <!-- Card body -->
        <div class="card-body">

            <!-- IPFS Node Status — inside the card, at the top -->
            <div id="ipfs-status-bar" class="checking">
                <div class="ipfs-dot"></div>
                <span>Checking IPFS node...</span>
            </div>

            <!-- File drop zone -->
            <div class="mb-5">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Select File to Upload</label>
                <div class="file-drop" id="file-drop-zone">
                    <input type="file" id="file-input" name="file" class="hidden" required>
                    <svg class="mx-auto h-10 w-10 text-blue-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                    </svg>
                    <p id="file-label" class="text-base font-medium text-gray-600">Drop your file here or click to browse</p>
                    <p class="text-sm text-gray-400 mt-1">Supports all file types</p>
                </div>
            </div>

            <!-- Upload button -->
            <button type="button" id="upload-btn" class="upload-btn">Upload File</button>

            <!-- Progress -->
            <div id="progress-container" class="hidden mt-4">
                <div class="progress-track">
                    <div id="progress-bar"></div>
                </div>
                <p id="progressText" class="text-sm text-gray-500 mt-2 text-center">Uploading... Please wait</p>
            </div>

            <!-- Result messages -->
            <div id="message" class="mt-4">
                <div id="successMessage" class="hidden"></div>
                <div id="errorMessage" class="hidden"></div>
            </div>

            <!-- Back to Home -->
            <div class="text-center mt-6">
                <button onclick="window.location.href='index.html'" class="back-btn">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                    </svg>
                    Back to Home
                </button>
            </div>

        </div><!-- /card-body -->
    </div><!-- /upload-card -->

    <script src="js/upload.js"></script>
    <script>
    (async function checkIPFS() {
        const bar = document.getElementById('ipfs-status-bar');
        if (!bar) return;
        bar.className = 'checking';
        bar.innerHTML = '<div class="ipfs-dot"></div><span>Checking IPFS node...</span>';
        try {
            const r = await fetch('/api/ipfs-status');
            const d = await r.json();
            if (d.online) {
                bar.className = 'online';
                bar.innerHTML = '<div class="ipfs-dot"></div><span>IPFS Node Online &mdash; ' + d.version + '</span>';
            } else {
                bar.className = 'offline';
                bar.innerHTML = '<div class="ipfs-dot"></div><span>IPFS Node Offline &mdash; Open IPFS Desktop and wait for the node to start</span>';
            }
        } catch(e) {
            bar.className = 'offline';
            bar.innerHTML = '<div class="ipfs-dot"></div><span>IPFS Node Offline &mdash; Open IPFS Desktop</span>';
        }
    })();
    </script>
</body>
</html>
