<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload File - Secure LAN File Sharing</title>
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .upload-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .file-drop {
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
        }
        .file-drop:hover, .file-drop.drag-over {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
        }
        .upload-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }
        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-gray-900 dark:to-gray-800 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full upload-card rounded-2xl shadow-2xl p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">Upload File</h1>
            <p class="text-blue-100">Share files securely over LAN</p>
        </div>

        <form id="uploadForm" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-white mb-2">Select File</label>
                <div class="file-drop" id="file-drop-zone">
                    <input type="file" id="file-input" name="file" class="hidden" required>
                    <svg class="mx-auto h-12 w-12 text-white mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                    </svg>
                    <p id="file-label" class="text-white font-medium text-sm">Drop your file here or click to browse</p>
                    <p class="text-blue-200 text-xs mt-1">Supports all file formats</p>
                </div>
            </div>

            <button 
                type="submit" 
                id="upload-btn"
                class="w-full upload-btn text-white font-bold py-3 px-6 rounded-lg transition duration-300"
            >
                Upload File
            </button>
        </form>

        <div id="progress-container" class="hidden mt-4">
            <div class="w-full bg-white/20 rounded-full h-2.5 overflow-hidden">
                <div id="progress-bar" class="bg-white h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <p id="progressText" class="text-white text-xs text-center mt-2">Uploading and encrypting...</p>
        </div>

        <div id="result-box" class="hidden mt-6 bg-white/10 p-4 rounded-xl text-white text-sm">
            <div class="flex items-center gap-1.5 text-emerald-300 font-bold mb-3">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
                File Uploaded Successfully!
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <span class="text-blue-200 block font-semibold mb-1">Transfer Code (CID):</span>
                    <div class="flex items-center gap-2">
                        <span id="res-cid" class="font-mono bg-black/30 px-2 py-1 rounded flex-1 truncate select-all"></span>
                        <button id="copy-cid-btn" class="bg-blue-500 hover:bg-blue-600 text-white px-2.5 py-1 rounded font-semibold text-xs transition">Copy</button>
                    </div>
                </div>
                <div>
                    <span class="text-blue-200 block font-semibold mb-1">Decryption Key:</span>
                    <div class="flex items-center gap-2">
                        <span id="res-key" class="font-mono bg-black/30 px-2 py-1 rounded flex-1 truncate select-all"></span>
                        <button id="copy-key-btn" class="bg-purple-600 hover:bg-purple-700 text-white px-2.5 py-1 rounded font-semibold text-xs transition">Copy</button>
                    </div>
                </div>
            </div>
            <div class="mt-4 pt-3 border-t border-white/10 flex gap-2">
                <a id="res-download-link" href="download.html" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold py-2 px-3 rounded-lg text-center flex-1 transition">
                    Download Page
                </a>
            </div>
        </div>

        <div id="errorMessage" class="hidden mt-4 bg-red-500 text-white p-3 rounded-lg text-sm"></div>

        <div class="text-center mt-6">
            <a href="index.html" class="inline-flex items-center text-blue-200 hover:text-white transition duration-300">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Home
            </a>
        </div>
    </div>

    <script src="js/upload.js"></script>
</body>
</html>
