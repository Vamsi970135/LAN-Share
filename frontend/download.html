<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download File - Secure LAN File Sharing</title>
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .download-card {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .cid-input {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #e5e7eb;
            transition: all 0.3s ease;
        }
        .cid-input:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }
        .download-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            transition: all 0.3s ease;
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-green-50 to-emerald-100 dark:from-gray-900 dark:to-gray-800 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full download-card rounded-2xl shadow-2xl p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">Download File</h1>
            <p class="text-green-100">Retrieve your files securely</p>
        </div>

        <form id="downloadForm" class="space-y-6">
            <div>
                <label for="cid-input" class="block text-sm font-semibold text-white mb-2">File Transfer Code (CID)</label>
                <input 
                    type="text" 
                    id="cid-input" 
                    required
                    placeholder="Enter file CID or code"
                    class="cid-input w-full px-4 py-3 rounded-lg text-gray-900 placeholder-gray-500 focus:outline-none font-mono text-sm"
                >
            </div>

            <button 
                type="submit" 
                id="download-btn"
                class="w-full download-btn text-white font-bold py-3 px-6 rounded-lg transition duration-300"
            >
                Download File
            </button>
        </form>

        <div id="progress-container" class="hidden mt-4">
            <div class="w-full bg-white/20 rounded-full h-2.5 overflow-hidden">
                <div id="progress-bar" class="bg-white h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <p id="progressText" class="text-white text-xs text-center mt-2">Retrieving and decrypting...</p>
        </div>

        <div id="message" class="mt-4">
            <div id="successMessage" class="hidden bg-emerald-800 text-white p-3 rounded-lg text-sm flex items-center gap-2">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
                <span id="successText"></span>
            </div>
            <div id="errorMessage" class="hidden bg-red-500 text-white p-3 rounded-lg text-sm flex items-center gap-2">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
                <span id="errorText"></span>
            </div>
        </div>

        <div class="text-center mt-6">
            <a href="index.html" class="inline-flex items-center text-green-200 hover:text-white transition duration-300">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Home
            </a>
        </div>
    </div>

    <script src="js/download.js"></script>
</body>
</html>
