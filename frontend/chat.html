<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peer Chat – Secure LAN File Sharing</title>
    <link rel="stylesheet" href="css/tailwind.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/socket-global.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%); min-height: 100vh; }

        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); }

        /* ---- SIDEBAR ---- */
        .peer-item {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px; padding: 10px 12px;
            margin-bottom: 8px; cursor: pointer;
            transition: all 0.2s;
        }
        .peer-item:hover    { background: rgba(255,255,255,0.1); border-color: rgba(99,179,237,0.3); }
        .peer-item.selected { background: rgba(59,130,246,0.2); border-color: #3b82f6; }

        /* ---- MESSAGES ---- */
        #chat-messages { flex: 1; overflow-y: auto; padding: 20px; }
        #chat-messages::-webkit-scrollbar { width: 4px; }
        #chat-messages::-webkit-scrollbar-track { background: transparent; }
        #chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

        .message-bubble {
            max-width: 68%;
            padding: 10px 14px;
            border-radius: 18px;
            word-wrap: break-word;
            font-size: 0.875rem;
            line-height: 1.5;
        }

        /* Sent — solid deep blue so white text is always readable */
        .sent {
            background: #2563eb;
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.45);
        }
        /* Sender name label above sent bubble */
        .sent-label {
            color: #93c5fd;
            font-size: 0.72rem;
            font-weight: 600;
            text-align: right;
            margin-bottom: 3px;
            padding-right: 4px;
        }
        /* Timestamp inside sent bubble */
        .sent .msg-time {
            color: rgba(255,255,255,0.65);
            font-size: 0.7rem;
            display: block;
            text-align: right;
            margin-top: 4px;
        }

        /* Received — semi-transparent white on dark */
        .received {
            background: rgba(255,255,255,0.1);
            color: #e2e8f0;
            border: 1px solid rgba(255,255,255,0.08);
            border-bottom-left-radius: 4px;
        }
        .received-label {
            color: #94a3b8;
            font-size: 0.72rem;
            font-weight: 600;
            margin-bottom: 3px;
            padding-left: 4px;
        }
        .received .msg-time {
            color: rgba(226,232,240,0.5);
            font-size: 0.7rem;
            display: block;
            text-align: right;
            margin-top: 4px;
        }

        .cid-card {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 10px 12px;
            margin-top: 6px;
        }
        .sent .cid-card {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.3);
        }
        .received .cid-card {
            background: rgba(59,130,246,0.15);
            border-color: rgba(59,130,246,0.3);
        }

        /* ---- INPUT AREA ---- */
        .chat-input-bar {
            padding: 14px 16px;
            border-top: 1px solid rgba(255,255,255,0.08);
            background: rgba(0,0,0,0.2);
        }
        #chat-input {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 10px 14px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: border 0.2s;
        }
        #chat-input:focus { border-color: rgba(99, 179, 237, 0.5); }
        #chat-input::placeholder { color: rgba(255,255,255,0.3); }
        #chat-input:disabled { opacity: 0.4; cursor: not-allowed; }

        .send-btn {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white; font-weight: 600; border-radius: 12px;
            padding: 10px 18px; border: none; cursor: pointer;
            transition: all 0.2s;
        }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .send-btn:not(:disabled):hover { opacity: 0.85; transform: scale(1.03); }

        .cid-share-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.8);
            border-radius: 10px; padding: 9px 14px;
            font-size: 0.8rem; cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        .cid-share-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .cid-share-btn:not(:disabled):hover { background: rgba(255,255,255,0.14); border-color: rgba(99,179,237,0.4); }

        /* ---- HEADER BAR ---- */
        .chat-header-bar {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex; align-items: center; gap: 12px;
        }

        /* ---- Back button in top bar — solid so it's always visible ---- */
        .back-to-peers-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: #ffffff;
            font-weight: 600;
            font-size: 0.82rem;
            padding: 7px 16px;
            border-radius: 9px;
            border: none;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(59,130,246,0.4);
            transition: all 0.2s;
            white-space: nowrap;
        }
        .back-to-peers-btn:hover {
            background: linear-gradient(135deg, #1d4ed8, #4338ca);
            box-shadow: 0 4px 14px rgba(59,130,246,0.55);
            transform: translateY(-1px);
        }

        /* ---- MODAL ---- */
        #cid-modal {
            background: rgba(0,0,0,0.6);
            position: fixed; inset: 0; z-index: 50;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(4px);
        }
        #cid-modal.hidden { display: none; }
        .modal-box {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            width: 100%; max-width: 440px;
            margin: 16px;
            padding: 24px;
        }
        .cid-file-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px; padding: 12px;
            margin-bottom: 8px; cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; gap: 12px;
            width: 100%; text-align: left;
        }
        .cid-file-btn:hover { background: rgba(59,130,246,0.15); border-color: #3b82f6; }

        #cid-list::-webkit-scrollbar { width: 4px; }
        #cid-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

        .online-dot {
            width: 8px; height: 8px; background: #4ade80;
            border-radius: 50%; display: inline-block;
            box-shadow: 0 0 6px #4ade80;
            animation: glow 2s infinite;
        }
        @keyframes glow { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
    </style>
</head>
<body class="p-4 md:p-6">

<div class="max-w-6xl mx-auto h-screen max-h-[90vh] flex flex-col gap-0 overflow-hidden rounded-2xl glass shadow-2xl" style="border-radius:20px">

    <!-- Top bar -->
    <div style="padding:18px 24px; border-bottom:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:space-between; flex-shrink:0">
        <div>
            <h1 class="text-white font-bold text-xl">Peer Chat</h1>
            <p class="text-slate-400 text-xs mt-0.5">Direct LAN messaging · No internet required</p>
        </div>
        <!-- Visible solid blue back button -->
        <button onclick="window.location.href='peers.html'" class="back-to-peers-btn">
            <svg style="width:15px;height:15px;flex-shrink:0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            Back to Peers
        </button>
    </div>

    <!-- Body: sidebar + chat -->
    <div class="flex flex-1 overflow-hidden">

        <!-- SIDEBAR: Peer List -->
        <div style="width:240px;flex-shrink:0;border-right:1px solid rgba(255,255,255,0.08);padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:0">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-3">Online Peers</p>

            <div id="peer-list"></div>

            <div id="no-peers" style="display:none;text-align:center;padding:30px 10px;color:rgba(255,255,255,0.3)">
                <svg class="w-10 h-10 mx-auto mb-2 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.14 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"/>
                </svg>
                <p class="text-xs">No peers on LAN</p>
            </div>

            <div style="margin-top:auto;padding-top:12px">
                <button id="start-chat"
                    style="width:100%;padding:9px;border-radius:10px;font-size:0.8rem;font-weight:600"
                    class="send-btn" disabled>
                    💬 Start Chat
                </button>
            </div>
        </div>

        <!-- CHAT WINDOW -->
        <div style="flex:1;display:flex;flex-direction:column;overflow:hidden">

            <!-- Chat header -->
            <div class="chat-header-bar">
                <div id="peer-avatar" style="width:36px;height:36px;background:linear-gradient(135deg,#3b82f6,#6366f1);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:white;font-size:1rem;flex-shrink:0">?</div>
                <div>
                    <p id="chat-header" class="text-white font-semibold text-sm">No peer selected</p>
                    <p id="connection-status" class="text-slate-500 text-xs">Select a peer from the sidebar</p>
                </div>
                <div style="margin-left:auto">
                    <span id="online-badge" class="hidden text-xs text-green-400 flex items-center gap-1">
                        <span class="online-dot"></span> Connected
                    </span>
                </div>
            </div>

            <!-- Messages -->
            <div id="chat-messages" style="flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:0">
                <div class="text-center text-slate-600 text-sm mt-12">
                    <svg class="w-12 h-12 mx-auto mb-3 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                    </svg>
                    Select a peer and start chatting
                </div>
            </div>

            <!-- Input bar -->
            <div class="chat-input-bar">
                <div style="display:flex;gap:8px;margin-bottom:8px">
                    <input id="chat-input" type="text"
                        placeholder="Type a message... (Enter to send)"
                        style="flex:1" disabled>
                    <button id="send-btn" class="send-btn" disabled>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                        </svg>
                    </button>
                </div>
                <button id="share-cid-btn" class="cid-share-btn w-full justify-center" disabled>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
                    </svg>
                    Share File via IPFS (Send CID)
                </button>
            </div>

        </div>
    </div>
</div>

<!-- CID Modal -->
<div id="cid-modal" class="hidden">
    <div class="modal-box">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
            <h3 class="text-white font-bold text-base flex items-center gap-2">
                <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                Select File to Share
            </h3>
            <button id="close-cid-modal" class="text-slate-400 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <p class="text-slate-400 text-xs mb-4">Choose a file you've uploaded to share its IPFS CID with this peer.</p>
        <div id="cid-list" style="max-height:280px;overflow-y:auto">
            <p class="text-slate-500 text-sm text-center py-4">Loading files...</p>
        </div>
    </div>
</div>

<script src="js/chat.js"></script>
</body>
</html>
